name: Validate Play AAB

on:
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/build-play-aab.yml'
      - '.github/workflows/validate-play-aab.yml'

permissions:
  contents: read

concurrency:
  group: hippoos-play-aab-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-aab:
    name: Release-mode Gradle AAB validation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/hippoos-ci-release.keystore
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: hippoosci
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            'platform-tools' \
            'build-tools;36.1.0' \
            'platforms;android-36' \
            'cmdline-tools;latest' \
            'cmake;3.10.2.4988404' \
            'ndk;29.0.14206865'

      - name: Create disposable CI release key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" \
            -storepass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" \
            -alias "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" \
            -keypass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -dname 'CN=Hippo OS CI,O=Hippo OS,C=ZA'

      - name: Set up Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          godot --version | grep -q '^4.7.2'

      - name: Validate Play preset
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          grep -q '^name="Android Play"$' export_presets.cfg
          grep -q 'gradle_build/use_gradle_build=true' export_presets.cfg
          grep -q 'gradle_build/export_format=1' export_presets.cfg
          grep -q 'package/unique_name="com.sashin.hippoos"' export_presets.cfg
          grep -q 'textures/vram_compression/import_etc2_astc=true' project.godot
          godot --headless --editor --path . --import --quit
          godot --headless --path . --quit-after 2

      - name: Export release-mode CI AAB
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          mkdir -p ../build
          godot --headless --verbose --path . \
            --install-android-build-template \
            --export-release 'Android Play' "$GITHUB_WORKSPACE/build/HippoOS-ci-release.aab"
          test -s "$GITHUB_WORKSPACE/build/HippoOS-ci-release.aab"

      - name: Verify CI bundle
        shell: bash
        run: |
          set -euxo pipefail
          AAB="$GITHUB_WORKSPACE/build/HippoOS-ci-release.aab"
          unzip -t "$AAB"
          jarsigner -verify -strict "$AAB"
          sha256sum "$AAB"
