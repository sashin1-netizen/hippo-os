name: Build Existing Hippo OS Update APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/test-signing/**'
      - '.github/scripts/**'
      - '.github/workflows/build-existing-app-update.yml'

permissions:
  contents: read

jobs:
  build-existing-update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/hippoos-personal.keystore
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: hippoospersonal
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: hippoos-personal
      HIPPOOS_TEST_CERT_SHA256: 3f19983ae8a86f7f7b20fa6be17b69882879c76a747f5d7744a6b063717f1dc2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36' 'cmdline-tools;latest' 'cmake;3.10.2.4988404' 'ndk;29.0.14206865'
      - name: Install original Hippo OS signing key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          base64 -d .github/test-signing/hippoos-personal-debug.keystore.b64 > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          keytool -list -v -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" -storepass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" -alias "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" | tee build-key.txt
          grep -q '3F:19:98:3A:E8:A8:6F:7F:7B:20:FA:6B:E1:7B:69:88:28:79:C7:6A:74:7F:5D:77:44:A6:B0:63:71:7F:1D:C2' build-key.txt
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF_SETTINGS
      - name: Fetch verified runtime assets
        run: bash .github/scripts/fetch-audio-assets.sh "$GITHUB_WORKSPACE"
      - name: Validate update identity and project
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          mkdir -p ../build
          grep -q '^name="Android Existing App Update"$' export_presets.cfg
          grep -q 'version/code=101' export_presets.cfg
          grep -q 'version/name="0.2.3-update"' export_presets.cfg
          grep -q 'package/unique_name="com.sashin.hippoos"' export_presets.cfg
          grep -Fq 'StartupFailSafe="*res://scripts/startup_fail_safe.gd"' project.godot
          test -f scripts/startup_fail_safe.gd
          godot --headless --editor --path . --import --quit 2>&1 | tee ../build/godot-import-existing-update.log
          ! grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to instantiate an autoload|SHADER ERROR:|Shader compilation failed' ../build/godot-import-existing-update.log
      - name: Export existing-app update APK
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          godot --headless --verbose --path . --export-release "Android Existing App Update" "$GITHUB_WORKSPACE/build/HippoOS-UPDATE-EXISTING.apk" 2>&1 | tee "$GITHUB_WORKSPACE/build/godot-export-existing-update.log"
          test -s "$GITHUB_WORKSPACE/build/HippoOS-UPDATE-EXISTING.apk"
          ! grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|SHADER ERROR:|Shader compilation failed' "$GITHUB_WORKSPACE/build/godot-export-existing-update.log"
      - name: Verify exact update package and signer
        shell: bash
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/build/HippoOS-UPDATE-EXISTING.apk"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" > build/HippoOS-UPDATE.badging.txt 2> build/HippoOS-UPDATE.badging.stderr.txt || true
          grep -q "package: name='com.sashin.hippoos'" build/HippoOS-UPDATE.badging.txt
          grep -q "versionCode='101'" build/HippoOS-UPDATE.badging.txt
          grep -q "targetSdkVersion:'36'" build/HippoOS-UPDATE.badging.txt
          unzip -l "$APK" | tee build/HippoOS-UPDATE.contents.txt
          grep -q 'lib/arm64-v8a/libgodot_android.so' build/HippoOS-UPDATE.contents.txt
          ! grep -q 'lib/x86_64/libgodot_android.so' build/HippoOS-UPDATE.contents.txt
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 -v 4 "$APK" | tee build/HippoOS-UPDATE.zipalign.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK" | tee build/HippoOS-UPDATE.signature.txt
          grep -qi "$HIPPOOS_TEST_CERT_SHA256" build/HippoOS-UPDATE.signature.txt
          sha256sum "$APK" | tee build/HippoOS-UPDATE.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: HippoOS-UPDATE-EXISTING-APP
          path: |
            build/HippoOS-UPDATE-EXISTING.apk
            build/HippoOS-UPDATE.badging.txt
            build/HippoOS-UPDATE.badging.stderr.txt
            build/HippoOS-UPDATE.signature.txt
            build/HippoOS-UPDATE.zipalign.txt
            build/HippoOS-UPDATE.sha256
            build/godot-import-existing-update.log
            build/godot-export-existing-update.log
          if-no-files-found: error
          retention-days: 30
