name: Build Hippo OS v0.2.6 Installer-Proven APK

on:
  workflow_dispatch:
  push:
    branches: [polish/4k-lifelike-animals]
    paths:
      - 'godot/**'
      - '.github/test-signing/**'
      - '.github/scripts/**'
      - '.github/workflows/build-existing-app-update-v026.yml'
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/test-signing/**'
      - '.github/scripts/**'
      - '.github/workflows/build-existing-app-update-v026.yml'

permissions:
  contents: write

concurrency:
  group: hippoos-v026-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-install-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/hippoos-personal.keystore
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: hippoospersonal
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: hippoos-personal
      HIPPOOS_TEST_CERT_SHA256: 3f19983ae8a86f7f7b20fa6be17b69882879c76a747f5d7744a6b063717f1dc2
      GODOT_TEMPLATE_VERSION: 4.7.2.stable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            'platform-tools' \
            'build-tools;36.1.0' \
            'platforms;android-36'
          mkdir -p build "$HOME/.android"
          "$ANDROID_HOME/platform-tools/adb" start-server || true

      - name: Install original Hippo OS signing key
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d .github/test-signing/hippoos-personal-debug.keystore.b64 > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          keytool -list -v \
            -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" \
            -storepass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" \
            -alias "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" | tee build/signing-key.txt
          grep -q '3F:19:98:3A:E8:A8:6F:7F:7B:20:FA:6B:E1:7B:69:88:28:79:C7:6A:74:7F:5D:77:44:A6:B0:63:71:7F:1D:C2' build/signing-key.txt

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF_SETTINGS
          godot --version | grep -q '^4.7.2'

      - name: Fetch verified runtime assets
        shell: bash
        run: bash .github/scripts/fetch-audio-assets.sh "$GITHUB_WORKSPACE"

      - name: Install official Godot Android Gradle template
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          rm -rf android
          TEMPLATE="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION/android_source.zip"
          test -s "$TEMPLATE"
          mkdir -p android/build
          unzip -q "$TEMPLATE" -d android/build
          printf '%s\n' "$GODOT_TEMPLATE_VERSION" > android/.build_version
          test -x android/build/gradlew
          test -f android/build/build.gradle
          test -f android/build/config.gradle
          test -f android/build/settings.gradle
          grep -q 'com.android.application' android/build/build.gradle
          find android/build -maxdepth 2 -type f | sort | tee ../build/gradle-template-files.txt

      - name: Validate project and v0.2.6 update identity
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          grep -q '^name="Android Existing App Update"$' export_presets.cfg
          grep -q '^name="Android Existing App Install CI"$' export_presets.cfg
          grep -q 'gradle_build/use_gradle_build=true' export_presets.cfg
          grep -q 'gradle_build/compress_native_libraries=false' export_presets.cfg
          grep -q 'version/code=104' export_presets.cfg
          grep -q 'version/name="0.2.6-package-fix"' export_presets.cfg
          grep -q 'package/unique_name="com.sashin.hippoos"' export_presets.cfg
          grep -q '^size/viewport_width=720$' project.godot
          grep -q '^size/viewport_height=1280$' project.godot
          grep -q '^handheld/orientation=1$' project.godot
          grep -Fq 'GameplayDirector="*res://scripts/gameplay_director.gd"' project.godot
          bash ../.github/scripts/verify-gameplay-candidate.sh ..
          godot --headless --editor --path . --import --quit 2>&1 | tee ../build/godot-import.log
          ! grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to instantiate an autoload|SHADER ERROR:|Shader compilation failed' ../build/godot-import.log

      - name: Export ARM64 update through Gradle
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          godot --headless --verbose --path . \
            --export-release 'Android Existing App Update' \
            "$GITHUB_WORKSPACE/build/HippoOS-v0.2.6-UPDATE.apk" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/godot-export-arm64.log"
          test -s "$GITHUB_WORKSPACE/build/HippoOS-v0.2.6-UPDATE.apk"
          ! grep -Eiq 'Starting legacy build system|SCRIPT ERROR:|Parse Error:|Failed to load script|SHADER ERROR:|Shader compilation failed' "$GITHUB_WORKSPACE/build/godot-export-arm64.log"

      - name: Verify ARM64 package before install gate
        shell: bash
        run: |
          set -euxo pipefail
          APK=build/HippoOS-v0.2.6-UPDATE.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" > build/arm64-badging.txt 2> build/arm64-badging.stderr.txt || true
          grep -q "package: name='com.sashin.hippoos'" build/arm64-badging.txt
          grep -q "versionCode='104'" build/arm64-badging.txt
          grep -q "targetSdkVersion:'36'" build/arm64-badging.txt
          unzip -t "$APK" | tee build/arm64-unzip-test.txt
          unzip -l "$APK" | tee build/arm64-contents.txt
          grep -q 'lib/arm64-v8a/libgodot_android.so' build/arm64-contents.txt
          ! grep -q 'lib/x86_64/libgodot_android.so' build/arm64-contents.txt
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              libs=[i for i in zf.infolist() if i.filename.endswith('.so')]
              assert libs, 'No native libraries in APK'
              compressed=[i.filename for i in libs if i.compress_type != zipfile.ZIP_STORED]
              assert not compressed, f'Compressed native libraries: {compressed}'
              print(f'Native libraries stored uncompressed: {len(libs)}')
          PY
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 -v 4 "$APK" | tee build/arm64-zipalign.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK" | tee build/arm64-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' build/arm64-signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' build/arm64-signature.txt
          grep -qi "$HIPPOOS_TEST_CERT_SHA256" build/arm64-signature.txt
          sha256sum "$APK" | tee build/HippoOS-v0.2.6-UPDATE.sha256

      - name: Export x86_64 PackageManager twin through same Gradle path
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          godot --headless --verbose --path . \
            --export-release 'Android Existing App Install CI' \
            "$GITHUB_WORKSPACE/build/HippoOS-v0.2.6-INSTALL-CI.apk" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/godot-export-x86.log"
          test -s "$GITHUB_WORKSPACE/build/HippoOS-v0.2.6-INSTALL-CI.apk"
          ! grep -Eiq 'Starting legacy build system|SCRIPT ERROR:|Parse Error:|Failed to load script|SHADER ERROR:|Shader compilation failed' "$GITHUB_WORKSPACE/build/godot-export-x86.log"

      - name: Verify install twin metadata signing and layout
        shell: bash
        run: |
          set -euxo pipefail
          APK=build/HippoOS-v0.2.6-INSTALL-CI.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" > build/x86-badging.txt 2> build/x86-badging.stderr.txt || true
          grep -q "package: name='com.sashin.hippoos'" build/x86-badging.txt
          grep -q "versionCode='104'" build/x86-badging.txt
          grep -q "targetSdkVersion:'36'" build/x86-badging.txt
          unzip -l "$APK" | tee build/x86-contents.txt
          grep -q 'lib/x86_64/libgodot_android.so' build/x86-contents.txt
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              libs=[i for i in zf.infolist() if i.filename.endswith('.so')]
              assert libs
              assert all(i.compress_type == zipfile.ZIP_STORED for i in libs)
          print('Install-twin native libraries are uncompressed')
          PY
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 -v 4 "$APK" > build/x86-zipalign.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK" | tee build/x86-signature.txt
          grep -qi "$HIPPOOS_TEST_CERT_SHA256" build/x86-signature.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 16 PackageManager install proof
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          script: |
            set -eux
            adb wait-for-device
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = '36'
            adb install -r build/HippoOS-v0.2.6-INSTALL-CI.apk | tee build/adb-install.txt
            grep -q '^Success$' build/adb-install.txt
            adb shell pm path com.sashin.hippoos | tee build/adb-pm-path.txt
            adb shell dumpsys package com.sashin.hippoos > build/adb-package.txt
            grep -q 'versionCode=104' build/adb-package.txt
            grep -q 'targetSdk=36' build/adb-package.txt

      - name: Upload installer-proven APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-v0.2.6-INSTALLER-PROVEN
          path: |
            build/HippoOS-v0.2.6-UPDATE.apk
            build/HippoOS-v0.2.6-UPDATE.sha256
            build/arm64-badging.txt
            build/arm64-signature.txt
            build/arm64-zipalign.txt
            build/arm64-unzip-test.txt
            build/adb-install.txt
            build/adb-pm-path.txt
            build/adb-package.txt
            build/godot-import.log
            build/godot-export-arm64.log
            build/godot-export-x86.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer-proven v0.2.6 APK
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: hippo-os-existing-update-v0.2.6
        run: |
          set -euxo pipefail
          APK=build/HippoOS-v0.2.6-UPDATE.apk
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK#HippoOS-v0.2.6-UPDATE.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$APK#HippoOS-v0.2.6-UPDATE.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Hippo OS Android 16 Installer-Proven v0.2.6' \
              --notes 'Existing-app update for com.sashin.hippoos, versionCode 104. Built with Godot 4.7.2 Gradle packaging, uncompressed native libraries, 16 KB alignment and the original Hippo OS signer. Publication occurs only after Android 16 PackageManager adb install -r returns Success.' \
              --prerelease
          fi