name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Unreal build configuration
        required: true
        default: Development
        type: choice
        options:
          - Development
          - Shipping

permissions:
  contents: read

env:
  UE_ROOT: C:\Program Files\Epic Games\UE_5.8

jobs:
  package-android:
    runs-on: [self-hosted, Windows, unreal-5.8, android]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unreal Engine
        shell: powershell
        run: |
          $uat = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          if (!(Test-Path $uat)) { throw "Unreal Engine 5.8 not found at $env:UE_ROOT" }

      - name: Package APK
        shell: powershell
        run: |
          .\Scripts\Build-Android.ps1 -EngineRoot "$env:UE_ROOT" -Configuration "${{ inputs.configuration }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Android-${{ inputs.configuration }}
          path: Artifacts/Android/**/*.apk
          if-no-files-found: error
