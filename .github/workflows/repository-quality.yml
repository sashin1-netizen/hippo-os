name: Repository Quality

on:
  push:
    branches: [main, polish/4k-lifelike-animals]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Validate authoritative Godot repository roots
        shell: bash
        run: |
          set -euo pipefail
          test -f godot/project.godot
          test -f godot/main.tscn
          test -f godot/export_presets.cfg
          test -f Docs/RELEASE_RUNTIME.md
          test -f .gitattributes
          test -f .gitignore

      - name: Validate Godot project structure
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^\[application\]' godot/project.godot
          grep -q '^\[rendering\]' godot/project.godot
          grep -q '^\[preset\.0\]' godot/export_presets.cfg

      - name: Reject generated Godot directories
        shell: bash
        run: |
          set -euo pipefail
          for dir in godot/.godot godot/build godot/bin; do
            if git ls-files "$dir" "$dir/**" | grep -q .; then
              echo "Generated Godot directory is tracked: $dir"
              exit 1
            fi
          done

      - name: Validate Hippo OS architecture contract
        shell: bash
        run: bash .github/scripts/verify-architecture-contract.sh "$GITHUB_WORKSPACE"

      - name: Validate Hippo OS gameplay candidate contract
        shell: bash
        run: bash .github/scripts/verify-gameplay-candidate.sh "$GITHUB_WORKSPACE"
