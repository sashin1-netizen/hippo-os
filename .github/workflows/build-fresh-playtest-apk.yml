name: Build Fresh-Install Playtest APK

on:
  workflow_dispatch:
  push:
    branches: [polish/4k-lifelike-animals]
    paths:
      - 'godot/**'
      - '.github/test-signing/**'
      - '.github/scripts/**'
      - '.github/workflows/build-fresh-playtest-apk.yml'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/hippoos-personal.keystore
  GODOT_ANDROID_KEYSTORE_RELEASE_USER: hippoospersonal
  GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: hippoos-personal
  HIPPOOS_TEST_CERT_SHA256: 3f19983ae8a86f7f7b20fa6be17b69882879c76a747f5d7744a6b063717f1dc2

jobs:
  fresh-install:
    name: Build verified ARM64 clean-room APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36' 'cmdline-tools;latest' 'cmake;3.10.2.4988404' 'ndk;29.0.14206865'
      - name: Install stable playtest signing key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android" build
          base64 -d .github/test-signing/hippoos-personal-debug.keystore.b64 > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Fetch verified runtime assets
        shell: bash
        run: bash .github/scripts/fetch-audio-assets.sh "$GITHUB_WORKSPACE"
      - name: Create isolated fresh-install export preset
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('godot/export_presets.cfg')
          text = p.read_text(encoding='utf-8')
          start = text.index('[preset.0]')
          end = text.index('[preset.1]')
          block = text[start:end].rstrip()
          block = block.replace('[preset.0]', '[preset.5]', 1)
          block = block.replace('[preset.0.options]', '[preset.5.options]', 1)
          block = block.replace('name="Android"', 'name="Android Fresh Install Playtest"', 1)
          block = block.replace('runnable=true', 'runnable=false', 1)
          block = block.replace('export_path="../build/HippoOS-Personal.apk"', 'export_path="../build/HippoOS-FRESH-PLAYTEST.apk"', 1)
          block = block.replace('version/code=104', 'version/code=105', 1)
          block = block.replace('version/name="0.2.6-package-fix"', 'version/name="0.2.6-fresh-playtest"', 1)
          block = block.replace('package/unique_name="com.sashin.hippoos"', 'package/unique_name="com.sashin.hippoos.playtest"', 1)
          block = block.replace('package/name="Hippo OS"', 'package/name="Hippo OS Playtest"', 1)
          p.write_text(text.rstrip() + '\n\n' + block + '\n', encoding='utf-8')
          PY
          grep -Fq 'name="Android Fresh Install Playtest"' godot/export_presets.cfg
          grep -Fq 'package/unique_name="com.sashin.hippoos.playtest"' godot/export_presets.cfg
      - name: Validate Godot project
        shell: bash
        run: |
          set -euxo pipefail
          cd godot
          godot --headless --editor --path . --import --quit 2>&1 | tee ../build/fresh-import.log
          ! grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to instantiate an autoload|SHADER ERROR:|Shader compilation failed' ../build/fresh-import.log
      - name: Export fresh-install ARM64 APK
        working-directory: godot
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --verbose --path . --export-release 'Android Fresh Install Playtest' "$GITHUB_WORKSPACE/build/HippoOS-FRESH-PLAYTEST.apk" 2>&1 | tee "$GITHUB_WORKSPACE/build/fresh-export.log"
          test -s "$GITHUB_WORKSPACE/build/HippoOS-FRESH-PLAYTEST.apk"
      - name: Verify fresh-install package contract
        shell: bash
        run: |
          set -euxo pipefail
          APK=build/HippoOS-FRESH-PLAYTEST.apk
          APKANALYZER="$(command -v apkanalyzer || find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/apkanalyzer' | sort -V | tail -n 1)"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          TARGET_SDK="$("$APKANALYZER" manifest target-sdk "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          printf 'applicationId=%s\ntargetSdk=%s\nversionCode=%s\n' "$APP_ID" "$TARGET_SDK" "$VERSION_CODE" | tee build/FRESH.package.txt
          test "$APP_ID" = 'com.sashin.hippoos.playtest'
          test "$TARGET_SDK" = '36'
          test "$VERSION_CODE" = '105'
          unzip -l "$APK" | tee build/FRESH.contents.txt
          grep -q 'lib/arm64-v8a/libgodot_android.so' build/FRESH.contents.txt
          ! grep -q 'lib/x86_64/libgodot_android.so' build/FRESH.contents.txt
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 -v 4 "$APK" | tee build/FRESH.zipalign.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK" | tee build/FRESH.signature.txt
          grep -qi "$HIPPOOS_TEST_CERT_SHA256" build/FRESH.signature.txt
          sha256sum "$APK" | tee build/FRESH.apk.sha256
      - name: Upload clean-room installer
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Fresh-Install-Playtest-APK
          path: |
            build/HippoOS-FRESH-PLAYTEST.apk
            build/FRESH.apk.sha256
            build/FRESH.package.txt
            build/FRESH.contents.txt
            build/FRESH.signature.txt
            build/FRESH.zipalign.txt
            build/fresh-import.log
            build/fresh-export.log
          if-no-files-found: error
          retention-days: 30
