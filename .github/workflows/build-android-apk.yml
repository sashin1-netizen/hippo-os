name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['godot/**', '.github/test-signing/**', '.github/scripts/**', '.github/workflows/build-android-apk.yml', '.github/workflows/build-play-aab.yml']
  pull_request:
    branches: [main]
    paths: ['godot/**', '.github/test-signing/**', '.github/scripts/**', '.github/workflows/build-android-apk.yml', '.github/workflows/build-play-aab.yml']

permissions:
  contents: read

concurrency:
  group: hippoos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    name: Build ARM64 release and emulator APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/hippoos-personal.keystore
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: hippoospersonal
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: hippoos-personal
      HIPPOOS_TEST_CERT_SHA256: 3f19983ae8a86f7f7b20fa6be17b69882879c76a747f5d7744a6b063717f1dc2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36' 'cmdline-tools;latest' 'cmake;3.10.2.4988404' 'ndk;29.0.14206865'
          "$ANDROID_HOME/build-tools/36.1.0/aapt" version
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" version
      - name: Install stable personal signing key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          base64 -d .github/test-signing/hippoos-personal-debug.keystore.b64 > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          keytool -list -v -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" -storepass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" -alias "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" | tee build-key.txt
          grep -q '3F:19:98:3A:E8:A8:6F:7F:7B:20:FA:6B:E1:7B:69:88:28:79:C7:6A:74:7F:5D:77:44:A6:B0:63:71:7F:1D:C2' build-key.txt
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF_SETTINGS
          godot --version | grep -q '^4.7.2'
      - name: Fetch verified audio and 4K PBR habitat
        run: bash .github/scripts/fetch-audio-assets.sh "$GITHUB_WORKSPACE"
      - name: Validate project and source assets
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          mkdir -p ../build
          test -f project.godot
          test -f export_presets.cfg
          test -f scripts/production_asset_loader.gd
          test -f scripts/lifelike_rendering.gd
          test -f scripts/grasslands_sanctuary.gd
          test -f scripts/pbr_habitat.gd
          test -f scripts/cinematic_quality.gd
          test -s assets/habitat/pbr/forrest_ground_01_diff_4k.jpg
          test -s assets/habitat/pbr/forrest_ground_01_nor_gl_4k.jpg
          test -s assets/habitat/pbr/forrest_ground_01_rough_4k.jpg
          test -s assets/habitat/pbr/rocks_ground_08_diff_4k.jpg
          test -s assets/habitat/pbr/rocks_ground_08_nor_gl_4k.jpg
          test -s assets/habitat/pbr/rocks_ground_08_rough_4k.jpg
          grep -q 'renderer/rendering_method="mobile"' project.godot
          grep -q 'rendering_device/fallback_to_opengl3=true' project.godot
          grep -q '^name="Android"$' export_presets.cfg
          grep -q '^name="Android Emulator CI"$' export_presets.cfg
          grep -q 'package/unique_name="com.sashin.hippoos.personal.ci"' export_presets.cfg
          grep -q 'command_line/extra_args="--rendering-method gl_compatibility --rendering-driver opengl3"' export_presets.cfg
          bash -n ../.github/scripts/verify-production-release.sh
          godot --headless --editor --path . --import --quit 2>&1 | tee ../build/godot-import.log
          ! grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to instantiate an autoload|SHADER ERROR:|Shader compilation failed' ../build/godot-import.log
          godot --headless --path . --quit-after 3 2>&1 | tee ../build/godot-smoke.log
          ! grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to instantiate an autoload|SHADER ERROR:|Shader compilation failed' ../build/godot-smoke.log
      - name: Export ARM64 Mobile Vulkan phone APK
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          godot --headless --verbose --path . --export-release Android "$GITHUB_WORKSPACE/build/HippoOS-Personal.apk" 2>&1 | tee "$GITHUB_WORKSPACE/build/godot-export-release.log"
          ! grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|SHADER ERROR:|Shader compilation failed' "$GITHUB_WORKSPACE/build/godot-export-release.log"
          test -s "$GITHUB_WORKSPACE/build/HippoOS-Personal.apk"
      - name: Verify ARM64 phone package
        shell: bash
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/build/HippoOS-Personal.apk"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" > build/HippoOS.badging.txt 2> build/HippoOS.badging.stderr.txt || true
          grep -q "package: name='com.sashin.hippoos.personal'" build/HippoOS.badging.txt
          grep -q "targetSdkVersion:'36'" build/HippoOS.badging.txt
          grep -q "versionCode='4'" build/HippoOS.badging.txt
          unzip -l "$APK" | tee build/HippoOS.contents.txt
          grep -q 'lib/arm64-v8a/libgodot_android.so' build/HippoOS.contents.txt
          ! grep -q 'lib/x86_64/libgodot_android.so' build/HippoOS.contents.txt
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 -v 4 "$APK" | tee build/HippoOS.zipalign.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK" | tee build/HippoOS.signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' build/HippoOS.signature.txt
          grep -qi "$HIPPOOS_TEST_CERT_SHA256" build/HippoOS.signature.txt
          sha256sum "$APK" | tee build/HippoOS.apk.sha256
      - name: Export x86_64 OpenGL emulator APK
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          cp project.godot "$GITHUB_WORKSPACE/build/project.godot.mobile-release"
          sed -i 's/renderer\/rendering_method="mobile"/renderer\/rendering_method="gl_compatibility"/' project.godot
          sed -i 's/renderer\/rendering_method.mobile="mobile"/renderer\/rendering_method.mobile="gl_compatibility"/' project.godot
          sed -i '/renderer\/rendering_method.mobile="gl_compatibility"/a limits/opengl/max_lights_per_object=2\nlimits/opengl/max_renderable_lights=8' project.godot
          grep -q 'renderer/rendering_method="gl_compatibility"' project.godot
          grep -q 'limits/opengl/max_lights_per_object=2' project.godot
          grep -q 'limits/opengl/max_renderable_lights=8' project.godot
          godot --headless --editor --path . --import --quit 2>&1 | tee "$GITHUB_WORKSPACE/build/godot-import-emulator.log"
          ! grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to instantiate an autoload|SHADER ERROR:|Shader compilation failed' "$GITHUB_WORKSPACE/build/godot-import-emulator.log"
          godot --headless --verbose --path . --export-release "Android Emulator CI" "$GITHUB_WORKSPACE/build/HippoOS-Emulator-CI.apk" 2>&1 | tee "$GITHUB_WORKSPACE/build/godot-export-emulator.log"
          ! grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|SHADER ERROR:|Shader compilation failed' "$GITHUB_WORKSPACE/build/godot-export-emulator.log"
          test -s "$GITHUB_WORKSPACE/build/HippoOS-Emulator-CI.apk"
          mv "$GITHUB_WORKSPACE/build/project.godot.mobile-release" project.godot
      - name: Verify x86_64 emulator package
        shell: bash
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/build/HippoOS-Emulator-CI.apk"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" > build/HippoOS-CI.badging.txt 2> build/HippoOS-CI.badging.stderr.txt || true
          grep -q "package: name='com.sashin.hippoos.personal.ci'" build/HippoOS-CI.badging.txt
          unzip -l "$APK" | tee build/HippoOS-CI.contents.txt
          grep -q 'lib/x86_64/libgodot_android.so' build/HippoOS-CI.contents.txt
          ! grep -q 'lib/arm64-v8a/libgodot_android.so' build/HippoOS-CI.contents.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee build/HippoOS-CI.apk.sha256
      - name: Upload phone release APK
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Personal-Release-APK
          path: |
            build/HippoOS-Personal.apk
            build/HippoOS.apk.sha256
            build/HippoOS.badging.txt
            build/HippoOS.badging.stderr.txt
            build/HippoOS.contents.txt
            build/HippoOS.signature.txt
            build/HippoOS.zipalign.txt
            build/godot-import.log
            build/godot-smoke.log
            build/godot-export-release.log
          if-no-files-found: error
          retention-days: 30
      - name: Upload emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Emulator-CI-APK
          path: |
            build/HippoOS-Emulator-CI.apk
            build/HippoOS-CI.apk.sha256
            build/HippoOS-CI.badging.txt
            build/HippoOS-CI.contents.txt
            build/godot-import-emulator.log
            build/godot-export-emulator.log
          if-no-files-found: error
          retention-days: 7

  android16-render-test:
    name: Render real Hippo OS frame on Android 16
    needs: build-apks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HippoOS-Emulator-CI-APK
          path: apk
      - name: Install screenshot validator
        run: python3 -m pip install --user pillow
      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Install launch and prove visible rendered frame
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb wait-for-device
            adb shell getprop ro.build.version.release | grep -q '^16$'
            adb shell getprop ro.build.version.sdk | grep -q '^36$'
            adb install -r apk/HippoOS-Emulator-CI.apk | tee apk/adb-install.txt
            grep -q '^Success$' apk/adb-install.txt
            adb shell pm path com.sashin.hippoos.personal.ci | tee apk/adb-package-path.txt
            adb shell dumpsys package com.sashin.hippoos.personal.ci | tee apk/adb-package.txt
            grep -q 'versionCode=4' apk/adb-package.txt
            grep -q 'targetSdk=36' apk/adb-package.txt
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb logcat -c
            adb shell monkey -p com.sashin.hippoos.personal.ci -c android.intent.category.LAUNCHER 1

            visible=0
            for attempt in $(seq 1 18); do
              sleep 5
              adb shell pidof com.sashin.hippoos.personal.ci | tee apk/adb-pid.txt
              test -s apk/adb-pid.txt
              adb logcat -d --pid=$(cat apk/adb-pid.txt) > apk/adb-app-logcat.txt
              adb logcat -d -t 1200 > apk/adb-logcat.txt
              ! grep -Eiq 'FATAL EXCEPTION|Process: com\.sashin\.hippoos\.personal\.ci.*has died|Unable to instantiate application' apk/adb-logcat.txt
              ! grep -Eiq 'Program linking failed|GL_MAX_FRAGMENT_UNIFORM_VECTORS|SHADER ERROR:|Shader compilation failed|SCRIPT ERROR:|Parse Error:' apk/adb-app-logcat.txt
              adb exec-out screencap -p > apk/launch-attempt.png
              test -s apk/launch-attempt.png

              if python3 - <<'PY'
            from PIL import Image, ImageStat
            image = Image.open('apk/launch-attempt.png').convert('RGB')
            stat = ImageStat.Stat(image)
            extrema = image.getextrema()
            spread = max(high - low for low, high in extrema)
            deviation = max(stat.stddev)
            mean = sum(stat.mean) / 3.0
            print(f'visual-proof mean={mean:.2f} max_stddev={deviation:.2f} spread={spread}')
            if deviation < 8.0 or spread < 30 or mean < 8.0:
                raise SystemExit(1)
            PY
              then
                cp apk/launch-attempt.png apk/launch.png
                visible=1
                echo "Visible Hippo OS frame proven on attempt ${attempt}."
                break
              fi
            done

            test "$visible" -eq 1
            adb shell dumpsys window displays > apk/window-displays.txt
            echo "Launch screenshot bytes: $(stat -c%s apk/launch.png)"
            test "$(stat -c%s apk/launch.png)" -ge 30000
      - name: Upload Android 16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Android16-Render-Evidence
          path: |
            apk/adb-install.txt
            apk/adb-package-path.txt
            apk/adb-package.txt
            apk/adb-pid.txt
            apk/adb-app-logcat.txt
            apk/adb-logcat.txt
            apk/window-displays.txt
            apk/launch.png
            apk/launch-attempt.png
          if-no-files-found: warn
          retention-days: 30
