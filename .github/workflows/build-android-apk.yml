name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, polish/4k-lifelike-animals]
    paths: ['godot/**', 'Docs/RELEASE_RUNTIME.md', '.github/test-signing/**', '.github/scripts/**', '.github/visual/**', '.github/workflows/build-android-apk.yml']
  pull_request:
    branches: [main]
    paths: ['godot/**', 'Docs/RELEASE_RUNTIME.md', '.github/test-signing/**', '.github/scripts/**', '.github/visual/**', '.github/workflows/build-android-apk.yml']

permissions:
  contents: read

concurrency:
  group: hippoos-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/hippoos-personal.keystore
  GODOT_ANDROID_KEYSTORE_RELEASE_USER: hippoospersonal
  GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: hippoos-personal
  HIPPOOS_TEST_CERT_SHA256: 3f19983ae8a86f7f7b20fa6be17b69882879c76a747f5d7744a6b063717f1dc2

jobs:
  build-apks:
    name: Build and verify ARM64 phone plus x86_64 CI APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" 'platform-tools' 'build-tools;36.1.0' 'platforms;android-36' 'cmdline-tools;latest' 'cmake;3.10.2.4988404' 'ndk;29.0.14206865'
      - name: Install stable personal signing key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android" build
          base64 -d .github/test-signing/hippoos-personal-debug.keystore.b64 > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          keytool -list -v -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" -storepass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" -alias "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" | tee build/build-key.txt
          grep -q '3F:19:98:3A:E8:A8:6F:7F:7B:20:FA:6B:E1:7B:69:88:28:79:C7:6A:74:7F:5D:77:44:A6:B0:63:71:7F:1D:C2' build/build-key.txt
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Fetch verified runtime assets
        run: bash .github/scripts/fetch-audio-assets.sh "$GITHUB_WORKSPACE"
      - name: Validate authoritative Godot runtime
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq 'Godot 4.7.x project under `godot/` is the only authoritative Android release runtime' Docs/RELEASE_RUNTIME.md
          bash .github/scripts/verify-architecture-contract.sh
          bash -n .github/scripts/android16-install-proof.sh
          bash -n .github/scripts/physical-android16-certification.sh
          cd godot
          godot --headless --editor --path . --import --quit 2>&1 | tee ../build/godot-import.log
          ! grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to instantiate an autoload|SHADER ERROR:|Shader compilation failed' ../build/godot-import.log
          godot --headless --path . --quit-after 5 2>&1 | tee ../build/godot-smoke.log
          ! grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to instantiate an autoload|SHADER ERROR:|Shader compilation failed' ../build/godot-smoke.log
      - name: Export ARM64 phone APK
        working-directory: godot
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --verbose --path . --export-release Android "$GITHUB_WORKSPACE/build/HippoOS-Personal.apk" 2>&1 | tee "$GITHUB_WORKSPACE/build/godot-export-release.log"
          test -s "$GITHUB_WORKSPACE/build/HippoOS-Personal.apk"
      - name: Verify ARM64 phone package
        shell: bash
        run: |
          set -euxo pipefail
          APK=build/HippoOS-Personal.apk
          APKANALYZER="$(command -v apkanalyzer || find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/apkanalyzer' | sort -V | tail -n 1)"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          TARGET_SDK="$("$APKANALYZER" manifest target-sdk "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          printf 'applicationId=%s\ntargetSdk=%s\nversionCode=%s\n' "$APP_ID" "$TARGET_SDK" "$VERSION_CODE" | tee build/HippoOS.package.txt
          test "$APP_ID" = 'com.sashin.hippoos'
          test "$TARGET_SDK" = '36'
          unzip -l "$APK" | tee build/HippoOS.contents.txt
          grep -q 'lib/arm64-v8a/libgodot_android.so' build/HippoOS.contents.txt
          ! grep -q 'lib/x86_64/libgodot_android.so' build/HippoOS.contents.txt
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 -v 4 "$APK" | tee build/HippoOS.zipalign.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK" | tee build/HippoOS.signature.txt
          grep -qi "$HIPPOOS_TEST_CERT_SHA256" build/HippoOS.signature.txt
          sha256sum "$APK" | tee build/HippoOS.apk.sha256
      - name: Create clean-room fresh-install preset
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('godot/export_presets.cfg')
          text = p.read_text(encoding='utf-8')
          start = text.index('[preset.0]')
          end = text.index('[preset.1]')
          block = text[start:end].rstrip()
          block = block.replace('[preset.0]', '[preset.5]', 1)
          block = block.replace('[preset.0.options]', '[preset.5.options]', 1)
          block = block.replace('name="Android"', 'name="Android Fresh Install Playtest"', 1)
          block = block.replace('runnable=true', 'runnable=false', 1)
          block = block.replace('export_path="../build/HippoOS-Personal.apk"', 'export_path="../build/HippoOS-FRESH-PLAYTEST.apk"', 1)
          block = block.replace('version/code=104', 'version/code=105', 1)
          block = block.replace('version/name="0.2.6-package-fix"', 'version/name="0.2.6-fresh-playtest"', 1)
          block = block.replace('package/unique_name="com.sashin.hippoos"', 'package/unique_name="com.sashin.hippoos.playtest"', 1)
          block = block.replace('package/name="Hippo OS"', 'package/name="Hippo OS Playtest"', 1)
          p.write_text(text.rstrip() + '\n\n' + block + '\n', encoding='utf-8')
          PY
      - name: Export clean-room fresh-install APK
        working-directory: godot
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --verbose --path . --export-release 'Android Fresh Install Playtest' "$GITHUB_WORKSPACE/build/HippoOS-FRESH-PLAYTEST.apk" 2>&1 | tee "$GITHUB_WORKSPACE/build/fresh-export.log"
          test -s "$GITHUB_WORKSPACE/build/HippoOS-FRESH-PLAYTEST.apk"
      - name: Verify clean-room fresh-install package
        shell: bash
        run: |
          set -euxo pipefail
          APK=build/HippoOS-FRESH-PLAYTEST.apk
          APKANALYZER="$(command -v apkanalyzer || find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/apkanalyzer' | sort -V | tail -n 1)"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          TARGET_SDK="$("$APKANALYZER" manifest target-sdk "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          printf 'applicationId=%s\ntargetSdk=%s\nversionCode=%s\n' "$APP_ID" "$TARGET_SDK" "$VERSION_CODE" | tee build/FRESH.package.txt
          test "$APP_ID" = 'com.sashin.hippoos.playtest'
          test "$TARGET_SDK" = '36'
          test "$VERSION_CODE" = '105'
          unzip -l "$APK" | tee build/FRESH.contents.txt
          grep -q 'lib/arm64-v8a/libgodot_android.so' build/FRESH.contents.txt
          ! grep -q 'lib/x86_64/libgodot_android.so' build/FRESH.contents.txt
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -P 16 -v 4 "$APK" | tee build/FRESH.zipalign.txt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK" | tee build/FRESH.signature.txt
          grep -qi "$HIPPOOS_TEST_CERT_SHA256" build/FRESH.signature.txt
          sha256sum "$APK" | tee build/FRESH.apk.sha256
      - name: Export x86_64 emulator APK
        working-directory: godot
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --verbose --path . --export-release 'Android Emulator CI' "$GITHUB_WORKSPACE/build/HippoOS-Emulator-CI.apk"
          test -s "$GITHUB_WORKSPACE/build/HippoOS-Emulator-CI.apk"
      - name: Verify x86_64 emulator package
        shell: bash
        run: |
          set -euxo pipefail
          APK=build/HippoOS-Emulator-CI.apk
          unzip -l "$APK" | tee build/HippoOS-CI.contents.txt
          grep -q 'lib/x86_64/libgodot_android.so' build/HippoOS-CI.contents.txt
          ! grep -q 'lib/arm64-v8a/libgodot_android.so' build/HippoOS-CI.contents.txt
          sha256sum "$APK" | tee build/HippoOS-CI.apk.sha256
      - name: Upload phone release candidate
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Personal-Release-APK
          path: |
            build/HippoOS-Personal.apk
            build/HippoOS.apk.sha256
            build/HippoOS.package.txt
            build/HippoOS.contents.txt
            build/HippoOS.signature.txt
            build/HippoOS.zipalign.txt
            build/godot-import.log
            build/godot-smoke.log
            build/godot-export-release.log
          if-no-files-found: error
          retention-days: 30
      - name: Upload clean-room fresh-install APK
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Fresh-Install-Playtest-APK
          path: |
            build/HippoOS-FRESH-PLAYTEST.apk
            build/FRESH.apk.sha256
            build/FRESH.package.txt
            build/FRESH.contents.txt
            build/FRESH.signature.txt
            build/FRESH.zipalign.txt
            build/fresh-export.log
          if-no-files-found: error
          retention-days: 30
      - name: Upload emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Emulator-CI-APK
          path: |
            build/HippoOS-Emulator-CI.apk
            build/HippoOS-CI.apk.sha256
            build/HippoOS-CI.contents.txt
          if-no-files-found: error
          retention-days: 7

  android16-install-test:
    name: Android 16 install and lifecycle proof
    needs: build-apks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: HippoOS-Emulator-CI-APK
          path: apk
      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Install and cold-launch on Android 16
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash .github/scripts/android16-install-proof.sh apk/HippoOS-Emulator-CI.apk apk/android16-install-proof
      - name: Upload Android 16 lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Android16-Install-Evidence
          path: apk/android16-install-proof/
          if-no-files-found: warn
          retention-days: 30
