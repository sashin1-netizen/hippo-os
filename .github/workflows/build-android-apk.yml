name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/scripts/fetch-audio-assets.sh'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/scripts/fetch-audio-assets.sh'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

concurrency:
  group: hippoos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Godot Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GODOT_VERSION: 4.7.2
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            'platform-tools' \
            'build-tools;36.1.0' \
            'platforms;android-36' \
            'cmdline-tools;latest' \
            'cmake;3.10.2.4988404' \
            'ndk;29.0.14206865'
          adb version
          java -version
          "$ANDROID_HOME/build-tools/36.1.0/aapt" version
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" version

      - name: Generate debug signing key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Hippo OS,C=ZA'
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Set up Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          godot --version
          godot --version | grep -q '^4.7.2'

      - name: Fetch verified sanctuary audio
        shell: bash
        run: |
          set -euxo pipefail
          bash .github/scripts/fetch-audio-assets.sh "$GITHUB_WORKSPACE"

      - name: Validate Godot project
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          test -f project.godot
          test -f main.tscn
          test -f export_presets.cfg
          test -s assets/audio/forest_ambience.ogg
          test -s assets/audio/water_stream.ogg
          test -s assets/audio/birds_garden.ogg
          grep -q 'AudioDirector="\*res://scripts/audio_director.gd"' project.godot
          grep -q 'textures/vram_compression/import_etc2_astc=true' project.godot
          grep -q 'gradle_build/use_gradle_build=false' export_presets.cfg
          ! grep -q 'gradle_build/min_sdk=' export_presets.cfg
          ! grep -q 'gradle_build/target_sdk=' export_presets.cfg
          grep -q 'package/unique_name="com.sashin.hippoos"' export_presets.cfg
          grep -q 'architectures/arm64-v8a=true' export_presets.cfg
          godot --headless --editor --path . --import --quit
          godot --headless --path . --quit-after 2

      - name: Export debug APK
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          mkdir -p ../build
          godot --headless --verbose --path . --export-debug Android "$GITHUB_WORKSPACE/build/HippoOS.apk"
          test -s "$GITHUB_WORKSPACE/build/HippoOS.apk"
          ls -lh "$GITHUB_WORKSPACE/build/HippoOS.apk"

      - name: Verify APK package, SDK and signature
        shell: bash
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/build/HippoOS.apk"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/build/HippoOS.badging.txt"
          grep -q "package: name='com.sashin.hippoos'" "$GITHUB_WORKSPACE/build/HippoOS.badging.txt"
          grep -q "targetSdkVersion:'36'" "$GITHUB_WORKSPACE/build/HippoOS.badging.txt"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/build/HippoOS.signature.txt"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/build/HippoOS.apk.sha256"

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Android-APK
          path: |
            build/HippoOS.apk
            build/HippoOS.apk.sha256
            build/HippoOS.badging.txt
            build/HippoOS.signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish phone-ready APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: apk-${{ github.run_number }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release create "$RELEASE_TAG" \
            build/HippoOS.apk \
            build/HippoOS.apk.sha256 \
            build/HippoOS.badging.txt \
            build/HippoOS.signature.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hippo OS Android APK · Build ${{ github.run_number }}" \
            --notes "Verified ARM64 Android debug APK built from main with Godot 4.7.2. Package: com.sashin.hippoos. Target SDK: Android 16 / API 36. Includes checksum-verified sanctuary ambience and the Hippo OS immersive spatial mix. The APK was signature-checked and its SHA-256 is attached."
