name: Hippo OS Android Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - release/android-v1-rc
    paths:
      - 'godot/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'godot/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate production assets and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      GODOT_VERSION: 4.7.2
      ANYCREATURE_COMMIT: ab5b1ce5c13e632f00f7f7cbfdb7a746e315000d
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile original rigged animal GLBs
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/anyCreature
          mkdir -p /tmp/anyCreature
          git -C /tmp/anyCreature init
          git -C /tmp/anyCreature remote add origin https://github.com/Ariescar/anyCreature.git
          git -C /tmp/anyCreature fetch --depth=1 origin "$ANYCREATURE_COMMIT"
          git -C /tmp/anyCreature checkout --detach FETCH_HEAD
          test "$(git -C /tmp/anyCreature rev-parse HEAD)" = "$ANYCREATURE_COMMIT"

          mkdir -p godot/assets/models
          node /tmp/anyCreature/engine/cli.js godot/model_specs/hippo.json godot/assets/models/mochi_pygmy_hippo.glb
          node /tmp/anyCreature/engine/cli.js godot/model_specs/pig.json godot/assets/models/truffle_pig.glb
          node /tmp/anyCreature/engine/cli.js godot/model_specs/shar_pei.json godot/assets/models/bao_shar_pei.glb

          test -s godot/assets/models/mochi_pygmy_hippo.glb
          test -s godot/assets/models/truffle_pig.glb
          test -s godot/assets/models/bao_shar_pei.glb
          ls -lh godot/assets/models/*.glb

      - name: Upload generated production models
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-production-models
          path: godot/assets/models/*.glb
          if-no-files-found: error
          retention-days: 14

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            'platform-tools' \
            'build-tools;36.0.0' \
            'platforms;android-36' \
            'cmdline-tools;latest' \
            'cmake;3.10.2.4988404' \
            'ndk;28.1.13356709'
          adb version
          java -version

      - name: Generate debug signing key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Hippo OS,C=ZA'
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Set up Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          godot --version

      - name: Import and parse project
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          test -f project.godot
          test -f main.tscn
          test -f export_presets.cfg
          godot --headless --editor --path . --import --quit

      - name: Run release self-test
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          godot --headless --path . --script res://scripts/release_self_test.gd

      - name: Smoke-launch sanctuary
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          timeout 20s godot --headless --path . --quit-after 5

      - name: Export internal debug APK
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          mkdir -p ../build
          godot --headless --verbose --path . --export-debug 'Android APK' "$GITHUB_WORKSPACE/build/HippoOS-internal.apk"
          test -s "$GITHUB_WORKSPACE/build/HippoOS-internal.apk"
          ls -lh "$GITHUB_WORKSPACE/build/HippoOS-internal.apk"

      - name: Upload internal APK for CI only
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-internal-APK-DO-NOT-DISTRIBUTE
          path: build/HippoOS-internal.apk
          if-no-files-found: error
          retention-days: 7
