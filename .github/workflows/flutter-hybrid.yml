name: Hippo OS Flutter Hybrid

on:
  workflow_dispatch:
  push:
    branches:
      - release/flutter-4k-v1
    paths:
      - 'flutter_app/**'
      - 'godot/scripts/sanctuary_runtime_v4.gd'
      - 'godot/scripts/launch_shell.gd'
      - '.github/workflows/flutter-hybrid.yml'

permissions:
  contents: read

jobs:
  flutter-shell:
    name: Validate Flutter shell
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Generate Android host scaffold
        working-directory: flutter_app
        run: flutter create --platforms=android --project-name hippo_os --org com.sashin .

      - name: Resolve dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter shell
        working-directory: flutter_app
        run: flutter analyze

      - name: Build Flutter debug shell
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Verify APK exists
        run: test -s flutter_app/build/app/outputs/flutter-apk/app-debug.apk
