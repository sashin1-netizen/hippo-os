name: Hippo OS Flutter Hybrid

on:
  workflow_dispatch:
  push:
    branches:
      - release/flutter-4k-v1
    paths:
      - 'flutter_app/**'
      - 'godot/**'
      - 'Tools/**'
      - '.github/workflows/flutter-hybrid.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'flutter_app/**'
      - 'godot/**'
      - 'Tools/**'
      - '.github/workflows/flutter-hybrid.yml'

permissions:
  contents: read

jobs:
  flutter-godot-hybrid:
    name: Validate Flutter + Godot open-world hybrid
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GODOT_VERSION: 4.7.2
      ANYCREATURE_COMMIT: ab5b1ce5c13e632f00f7f7cbfdb7a746e315000d

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile original refined rigged animals
        shell: bash
        run: |
          set -euxo pipefail
          python3 Tools/augment_model_animations.py
          rm -rf /tmp/anyCreature
          mkdir -p /tmp/anyCreature
          git -C /tmp/anyCreature init
          git -C /tmp/anyCreature remote add origin https://github.com/Ariescar/anyCreature.git
          git -C /tmp/anyCreature fetch --depth=1 origin "$ANYCREATURE_COMMIT"
          git -C /tmp/anyCreature checkout --detach FETCH_HEAD
          test "$(git -C /tmp/anyCreature rev-parse HEAD)" = "$ANYCREATURE_COMMIT"
          mkdir -p godot/assets/models
          node /tmp/anyCreature/engine/cli.js godot/model_specs/hippo.json godot/assets/models/mochi_pygmy_hippo.glb
          node /tmp/anyCreature/engine/cli.js godot/model_specs/pig.json godot/assets/models/truffle_pig.glb
          node /tmp/anyCreature/engine/cli.js godot/model_specs/shar_pei.json godot/assets/models/bao_shar_pei.glb
          test -s godot/assets/models/mochi_pygmy_hippo.glb
          test -s godot/assets/models/truffle_pig.glb
          test -s godot/assets/models/bao_shar_pei.glb

      - name: Generate sanctuary production assets
        run: |
          set -euxo pipefail
          python3 Tools/generate_release_audio.py
          test -s godot/assets/audio/sanctuary_ambience.wav
          test -s godot/assets/audio/water_splash.wav
          test -s godot/assets/audio/mud_squelch.wav
          test -s godot/assets/audio/eat_crunch.wav
          test -s godot/assets/audio/drink_lap.wav
          test -s godot/assets/textures/leafy_grass_diff_4k.jpg
          test -s godot/assets/textures/leafy_grass_nor_gl_4k.jpg
          test -s godot/assets/textures/leafy_grass_rough_4k.jpg
          test -s godot/assets/textures/brown_mud_03_diff_4k.jpg
          test -s godot/assets/textures/brown_mud_03_nor_gl_4k.jpg
          test -s godot/assets/textures/brown_mud_03_rough_4k.jpg
          test -s godot/assets/textures/kloofendal_38d_partly_cloudy_puresky.jpg

      - name: Download licensed authentic animal recordings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p godot/assets/audio
          curl --fail --location --retry 4 --user-agent 'HippoOS-build/1.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Pig%20grunt%20-%20Erdie.ogg' \
            -o godot/assets/audio/pig_grunt.ogg
          curl --fail --location --retry 4 --user-agent 'HippoOS-build/1.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Dog.ogg' \
            -o godot/assets/audio/dog_natural.ogg
          curl --fail --location --retry 4 --user-agent 'HippoOS-build/1.0' \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Ladrido%20perro.ogg' \
            -o godot/assets/audio/dog_bark.ogg
          HIPPO_PAGE="$(mktemp)"
          curl --fail --location --retry 4 --user-agent 'Mozilla/5.0 HippoOS-build/1.0' \
            'https://freesound.org/people/toadie/sounds/194870/' -o "$HIPPO_PAGE"
          HIPPO_PREVIEW="$(grep -oE 'https://cdn\.freesound\.org/previews/[^"'"'"' ]+\.(mp3|ogg)' "$HIPPO_PAGE" | head -n 1 || true)"
          if [ -z "$HIPPO_PREVIEW" ]; then
            HIPPO_PREVIEW="$(grep -oE '//cdn\.freesound\.org/previews/[^"'"'"' ]+\.(mp3|ogg)' "$HIPPO_PAGE" | head -n 1 || true)"
            [ -n "$HIPPO_PREVIEW" ] && HIPPO_PREVIEW="https:${HIPPO_PREVIEW}"
          fi
          test -n "$HIPPO_PREVIEW"
          curl --fail --location --retry 4 --user-agent 'HippoOS-build/1.0' "$HIPPO_PREVIEW" \
            -o godot/assets/audio/hippo_grunts.mp3
          test "$(stat -c%s godot/assets/audio/pig_grunt.ogg)" -gt 8000
          test "$(stat -c%s godot/assets/audio/dog_natural.ogg)" -gt 1000000
          test "$(stat -c%s godot/assets/audio/dog_bark.ogg)" -gt 30000
          test "$(stat -c%s godot/assets/audio/hippo_grunts.mp3)" -gt 100000

      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import and parse open-world sanctuary
        working-directory: godot
        run: |
          set -euxo pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/godot-import.log
          ! grep -q 'SCRIPT ERROR' /tmp/godot-import.log
          ! grep -q 'Error importing' /tmp/godot-import.log
          timeout 25s godot --headless --path . --quit-after 7 2>&1 | tee /tmp/godot-smoke.log
          ! grep -q 'SCRIPT ERROR' /tmp/godot-smoke.log
          ! grep -q 'Failed loading resource' /tmp/godot-smoke.log
          ! grep -q 'Invalid set index' /tmp/godot-smoke.log
          ! grep -q 'Invalid call' /tmp/godot-smoke.log

      - name: Run personal release self-test
        working-directory: godot
        run: |
          set -euxo pipefail
          godot --headless --path . --script res://scripts/release_self_test.gd 2>&1 | tee /tmp/hippo-self-test.log
          grep -q 'SELF-TEST PASS' /tmp/hippo-self-test.log
          ! grep -q 'SELF-TEST FAIL' /tmp/hippo-self-test.log

      - name: Install software renderer for visual QA
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Capture sanctuary visual QA frame
        working-directory: godot
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            godot --path . --display-driver x11 --resolution 1920x1080 \
            --script res://scripts/release_capture.gd 2>&1 | tee /tmp/hippo-visual-qa.log
          grep -q 'VISUAL QA CAPTURE PASS' /tmp/hippo-visual-qa.log
          test -s artifacts/sanctuary-cinematic-1080p.png

      - name: Upload visual QA frame
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Visual-QA
          path: godot/artifacts/sanctuary-cinematic-1080p.png
          if-no-files-found: error
          retention-days: 7

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Generate Flutter Android scaffold
        working-directory: flutter_app
        run: |
          flutter create --platforms=android --project-name hippo_os --org com.sashin .
          rm -f test/widget_test.dart

      - name: Apply hybrid native host
        shell: bash
        run: |
          set -euxo pipefail
          KOTLIN_DIR='flutter_app/android/app/src/main/kotlin/com/sashin/hippo_os'
          mkdir -p "$KOTLIN_DIR"
          cp flutter_app/native_overrides/MainActivity.kt "$KOTLIN_DIR/MainActivity.kt"
          cp flutter_app/native_overrides/HippoFlutterPlugin.kt "$KOTLIN_DIR/HippoFlutterPlugin.kt"
          cp flutter_app/native_overrides/build.gradle.kts flutter_app/android/app/build.gradle.kts
          cp flutter_app/native_overrides/AndroidManifest.xml flutter_app/android/app/src/main/AndroidManifest.xml

      - name: Embed imported Godot sanctuary
        shell: bash
        run: |
          set -euxo pipefail
          ASSET_DIR='flutter_app/android/app/src/main/assets'
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          cp -a godot/. "$ASSET_DIR/"
          rm -rf "$ASSET_DIR/android" "$ASSET_DIR/.git" "$ASSET_DIR/artifacts"
          test -f "$ASSET_DIR/project.godot"
          test -d "$ASSET_DIR/.godot"
          test -s "$ASSET_DIR/assets/models/mochi_pygmy_hippo.glb"
          test -s "$ASSET_DIR/assets/textures/leafy_grass_diff_4k.jpg"
          test -s "$ASSET_DIR/assets/textures/brown_mud_03_diff_4k.jpg"
          test -s "$ASSET_DIR/assets/textures/kloofendal_38d_partly_cloudy_puresky.jpg"
          test -f "$ASSET_DIR/scripts/open_world_controller.gd"
          test -f "$ASSET_DIR/scripts/open_world_environment.gd"
          test -f "$ASSET_DIR/scripts/relationship_runtime.gd"
          test -f "$ASSET_DIR/scripts/animal_surface_effects.gd"

      - name: Resolve Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Flutter open-world shell
        working-directory: flutter_app
        run: flutter analyze

      - name: Run Flutter contract tests
        working-directory: flutter_app
        run: flutter test test/sanctuary_contract_test.dart

      - name: Verify open-world Flutter entrypoint
        shell: bash
        run: |
          set -euxo pipefail
          grep -q "open_world_app.dart" flutter_app/lib/main.dart
          grep -q "runOpenWorldApp" flutter_app/lib/main.dart
          grep -q "roam:" flutter_app/lib/open_world_app.dart
          grep -q "BODYCAM" flutter_app/lib/open_world_app.dart

      - name: Build phone-sized ARM64 preview APK
        working-directory: flutter_app
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Verify ARM64 preview build
        shell: bash
        run: |
          set -euxo pipefail
          APK='flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          test -s "$APK"
          ls -lh "$APK"

          python3 - <<'PY'
          import zipfile
          apk='flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
          assert 'lib/arm64-v8a/libgodot_android.so' in names
          assert 'lib/x86_64/libgodot_android.so' not in names
          assert 'lib/armeabi-v7a/libgodot_android.so' not in names
          print('ARM64-only APK verified')
          PY

          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/hippo-apk-badging.txt
          grep -q "package: name='com.sashin.hippoos.preview'" /tmp/hippo-apk-badging.txt
          grep -q "application-label:'Hippo OS Preview'" /tmp/hippo-apk-badging.txt

      - name: Upload phone preview APK for internal QA
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-OpenWorld-Internal-ARM64
          path: flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
