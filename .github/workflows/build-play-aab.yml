name: Build Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hippoos-play-aab
  cancel-in-progress: false

jobs:
  production-gate:
    name: Prove production release assets and device acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enforce production release gate
        shell: bash
        run: bash .github/scripts/verify-production-release.sh "$GITHUB_WORKSPACE"

  build-aab:
    name: Release-signed Android App Bundle
    needs: production-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HIPPOOS_RELEASE_KEYSTORE_BASE64: ${{ secrets.HIPPOOS_RELEASE_KEYSTORE_BASE64 }}
      HIPPOOS_RELEASE_KEY_ALIAS: ${{ secrets.HIPPOOS_RELEASE_KEY_ALIAS }}
      HIPPOOS_RELEASE_KEY_PASSWORD: ${{ secrets.HIPPOOS_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            'platform-tools' \
            'build-tools;36.1.0' \
            'platforms;android-36' \
            'cmdline-tools;latest' \
            'cmake;3.10.2.4988404' \
            'ndk;29.0.14206865'

      - name: Set up Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          godot --version | grep -q '^4.7.2'

      - name: Fetch verified audio assets
        shell: bash
        run: bash .github/scripts/fetch-audio-assets.sh "$GITHUB_WORKSPACE"

      - name: Validate production signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for value in HIPPOOS_RELEASE_KEYSTORE_BASE64 HIPPOOS_RELEASE_KEY_ALIAS HIPPOOS_RELEASE_KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $value"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/hippoos-release.keystore"
          printf '%s' "$HIPPOOS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$HIPPOOS_RELEASE_KEY_PASSWORD" -alias "$HIPPOOS_RELEASE_KEY_ALIAS" >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$HIPPOOS_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$HIPPOOS_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Strictly validate final Godot project
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          grep -q '^name="Android Play"$' export_presets.cfg
          grep -q 'custom_features="production_release"' export_presets.cfg
          grep -q 'gradle_build/use_gradle_build=true' export_presets.cfg
          grep -q 'gradle_build/export_format=1' export_presets.cfg
          grep -q 'package/unique_name="com.sashin.hippoos"' export_presets.cfg
          grep -q 'version/name="1.0.0"' export_presets.cfg
          grep -q 'version/code=100' export_presets.cfg
          fail_on_engine_errors() {
            local log="$1"
            if grep -Eiq 'SCRIPT ERROR:|Parse Error:|SHADER ERROR:|Shader compilation failed|Failed to load script|Failed to create an autoload|Failed to instantiate an autoload|is not compiling' "$log"; then
              cat "$log" >&2
              exit 1
            fi
          }
          mkdir -p ../build
          godot --headless --editor --path . --import --quit 2>&1 | tee ../build/play-import.log
          fail_on_engine_errors ../build/play-import.log
          godot --headless --path . --quit-after 3 2>&1 | tee ../build/play-smoke.log
          fail_on_engine_errors ../build/play-smoke.log

      - name: Build release-signed production AAB
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          godot --headless --verbose --path . --install-android-build-template --export-release 'Android Play' "$GITHUB_WORKSPACE/build/HippoOS-release.aab" 2>&1 | tee "$GITHUB_WORKSPACE/build/play-export.log"
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|SHADER ERROR:|Shader compilation failed|Failed to load script|Failed to create an autoload|Failed to instantiate an autoload|is not compiling' "$GITHUB_WORKSPACE/build/play-export.log"; then
            cat "$GITHUB_WORKSPACE/build/play-export.log" >&2
            exit 1
          fi
          test -s "$GITHUB_WORKSPACE/build/HippoOS-release.aab"

      - name: Verify bundle and checksum
        shell: bash
        run: |
          set -euxo pipefail
          AAB="$GITHUB_WORKSPACE/build/HippoOS-release.aab"
          unzip -t "$AAB"
          jarsigner -verify -strict -verbose -certs "$AAB" | tee "$GITHUB_WORKSPACE/build/HippoOS-release.signature.txt"
          sha256sum "$AAB" | tee "$GITHUB_WORKSPACE/build/HippoOS-release.aab.sha256"
          ls -lh "$AAB"

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Production-Play-AAB
          path: |
            build/HippoOS-release.aab
            build/HippoOS-release.aab.sha256
            build/HippoOS-release.signature.txt
            build/play-import.log
            build/play-smoke.log
            build/play-export.log
          if-no-files-found: error
          retention-days: 30
