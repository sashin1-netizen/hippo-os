name: Build Play Store AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hippoos-play-aab
  cancel-in-progress: false

jobs:
  build-aab:
    name: Release-signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      HIPPOOS_RELEASE_KEYSTORE_BASE64: ${{ secrets.HIPPOOS_RELEASE_KEYSTORE_BASE64 }}
      HIPPOOS_RELEASE_KEY_ALIAS: ${{ secrets.HIPPOOS_RELEASE_KEY_ALIAS }}
      HIPPOOS_RELEASE_KEY_PASSWORD: ${{ secrets.HIPPOOS_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            'platform-tools' \
            'build-tools;36.1.0' \
            'platforms;android-36' \
            'cmdline-tools;latest' \
            'cmake;3.10.2.4988404' \
            'ndk;29.0.14206865'

      - name: Set up Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android editor settings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          godot --version | grep -q '^4.7.2'

      - name: Validate production signing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HIPPOOS_RELEASE_KEYSTORE_BASE64" ] || [ -z "$HIPPOOS_RELEASE_KEY_ALIAS" ] || [ -z "$HIPPOOS_RELEASE_KEY_PASSWORD" ]; then
            echo '::error::Production signing is not configured. Add HIPPOOS_RELEASE_KEYSTORE_BASE64, HIPPOOS_RELEASE_KEY_ALIAS and HIPPOOS_RELEASE_KEY_PASSWORD as GitHub Actions secrets.'
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/hippoos-release.keystore"
          printf '%s' "$HIPPOOS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$HIPPOOS_RELEASE_KEY_PASSWORD" \
            -alias "$HIPPOOS_RELEASE_KEY_ALIAS" >/dev/null

          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$HIPPOOS_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$HIPPOOS_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Validate Play export configuration
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          grep -q '^name="Android Play"$' export_presets.cfg
          grep -q 'gradle_build/use_gradle_build=true' export_presets.cfg
          grep -q 'gradle_build/export_format=1' export_presets.cfg
          grep -q 'package/unique_name="com.sashin.hippoos"' export_presets.cfg
          grep -q 'textures/vram_compression/import_etc2_astc=true' project.godot
          godot --headless --editor --path . --import --quit
          godot --headless --path . --quit-after 2

      - name: Build release-signed AAB
        shell: bash
        working-directory: godot
        run: |
          set -euxo pipefail
          mkdir -p ../build
          godot --headless --verbose --path . \
            --install-android-build-template \
            --export-release 'Android Play' "$GITHUB_WORKSPACE/build/HippoOS-release.aab"
          test -s "$GITHUB_WORKSPACE/build/HippoOS-release.aab"

      - name: Verify bundle signature and checksum
        shell: bash
        run: |
          set -euxo pipefail
          AAB="$GITHUB_WORKSPACE/build/HippoOS-release.aab"
          unzip -t "$AAB"
          jarsigner -verify -strict -verbose -certs "$AAB" | tee "$GITHUB_WORKSPACE/build/HippoOS-release.signature.txt"
          sha256sum "$AAB" | tee "$GITHUB_WORKSPACE/build/HippoOS-release.aab.sha256"
          ls -lh "$AAB"

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: HippoOS-Play-Store-AAB
          path: |
            build/HippoOS-release.aab
            build/HippoOS-release.aab.sha256
            build/HippoOS-release.signature.txt
          if-no-files-found: error
          retention-days: 30
